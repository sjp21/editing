[project]
name = "clipper"
version = "0.1.0"
description = "Video-to-Clips pipeline: identifies short-form candidate clips from long-form video"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "faster-whisper>=1.0.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = [
    "SOUL.md",
    "prompts/*/*.md",
    "prompts/*/profiles/*.md",
    "assets/fonts/*.ttf",
    "assets/models/*.tflite",
]
